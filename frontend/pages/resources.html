<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Resources | PolarConnect</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/search.css">
</head>

<body class="search-page">

<header class="navbar">
    <div class="nav-container">

        <a href="../index.html" class="logo">
            Polar<span>Connect</span>
        </a>

        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="climate.html">Climate</a>
            <a href="ice-glaciers.html">Ice &amp; Glaciers</a>
            <a href="polar-oceans.html">Polar Oceans</a>
            <a href="biodiversity.html">Biodiversity</a>
            <a href="research.html">Research</a>
            <a href="resources.html" class="active">All Resources</a>
            <a href="map.html">Data &amp; Maps</a>
        </nav>

        <a href="login.html" class="login-btn">Login</a>

    </div>
</header>


<section class="search-hero">

    <div class="search-hero-content">

        <div class="eyebrow">
            <span></span>
            POLAR RESOURCE LIBRARY
        </div>

        <h1>
            All <span>resources.</span>
        </h1>

        <p>
            Search, filter and open knowledge, research, datasets,
            reports and maps from the Polar Science Portal.
        </p>

    </div>

</section>


<main class="search-main">

    <!-- Search -->
    <div class="search-box">

        <div class="search-input-wrapper">
            <span class="search-icon">⌕</span>

            <input
                id="resource-search"
                type="text"
                placeholder="Search glacier, climate, Arctic..."
                autocomplete="off"
            >
        </div>

        <button id="resource-search-btn" class="search-button">
            Search
        </button>

    </div>


    <!-- Category Filter -->
    <div class="feature-grid">

        <div class="feature-card">

            <h3>Category</h3>

            <select id="category-filter">

                <option value="">All</option>

                <option value="Polar Science">
                    Polar Science
                </option>

                <option value="Research">
                    Research
                </option>

                <option value="Climate">
                    Climate
                </option>

                <option value="Ice &amp; Glaciers">
                    Ice &amp; Glaciers
                </option>

                <option value="Polar Oceans">
                    Polar Oceans
                </option>

                <option value="Wildlife">
                    Wildlife
                </option>

            </select>

        </div>

    </div>


    <!-- Status -->
    <div id="resource-status" class="section-label">
        Loading resources...
    </div>


    <!-- Results -->
    <div id="resource-grid" class="search-results-grid"></div>

</main>


<script src="../js/api.js"></script>
<script src="../js/resources.js"></script>

</body>
</html>
