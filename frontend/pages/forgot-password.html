<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | PolarConnect</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        /* =========================================
           FORGOT PASSWORD PAGE
        ========================================= */

        body.forgot-password-page {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(92, 210, 245, 0.12),
                    transparent 45%
                ),
                #071522;
            color: #ffffff;
        }


        /* =========================================
           NAVBAR
        ========================================= */

        .forgot-password-page header {
            position: relative;
            z-index: 10;
        }

        .forgot-password-page .navbar {
            background: rgba(5, 18, 30, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .forgot-password-page .logo {
            color: #ffffff;
        }

        .forgot-password-page .logo span {
            color: #73d8f7;
        }

        .forgot-password-page .nav-links a {
            color: rgba(255, 255, 255, 0.75);
        }

        .forgot-password-page .nav-links a:hover,
        .forgot-password-page .nav-links a.active {
            color: #ffffff;
        }

        .forgot-password-page .nav-login {
            color: #ffffff;
        }


        /* =========================================
           MAIN
        ========================================= */

        .forgot-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            box-sizing: border-box;
        }


        .forgot-card {
            width: 100%;
            max-width: 470px;
            padding: 42px;
            box-sizing: border-box;

            background: rgba(13, 35, 52, 0.88);

            border: 1px solid rgba(115, 216, 247, 0.16);

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(18px);
        }


        /* =========================================
           HEADING
        ========================================= */

        .forgot-tag {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 8px 14px;

            border: 1px solid rgba(115, 216, 247, 0.35);

            border-radius: 999px;

            color: #73d8f7;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .forgot-tag::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #73d8f7;
        }


        .forgot-title {
            margin: 26px 0 12px;

            font-size: 38px;
            line-height: 1.1;

            font-weight: 700;

            color: #ffffff;
        }


        .forgot-description {
            margin: 0 0 30px;

            color: rgba(255, 255, 255, 0.66);

            line-height: 1.7;
            font-size: 15px;
        }


        /* =========================================
           FORM
        ========================================= */

        .forgot-group {
            margin-bottom: 20px;
        }


        .forgot-group label {
            display: block;

            margin-bottom: 9px;

            font-size: 14px;
            font-weight: 600;

            color: rgba(255, 255, 255, 0.92);
        }


        .forgot-group input {
            width: 100%;

            box-sizing: border-box;

            padding: 15px 16px;

            border-radius: 10px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            background: rgba(255, 255, 255, 0.055);

            color: #ffffff;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .forgot-group input::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }


        .forgot-group input:focus {
            border-color: rgba(115, 216, 247, 0.7);

            background: rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 0 3px rgba(115, 216, 247, 0.09);
        }


        /* =========================================
           BUTTON
        ========================================= */

        .forgot-button {
            width: 100%;

            margin-top: 8px;

            padding: 15px 20px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #67d5f5,
                #3daed5
            );

            color: #061521;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .forgot-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(72, 193, 232, 0.22);
        }


        .forgot-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .forgot-message {
            display: none;

            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.5;
        }


        .forgot-message.success {
            display: block;

            color: #b7f5ca;

            background: rgba(58, 180, 95, 0.12);

            border: 1px solid rgba(58, 180, 95, 0.25);
        }


        .forgot-message.error {
            display: block;

            color: #ffbcbc;

            background: rgba(220, 70, 70, 0.12);

            border: 1px solid rgba(220, 70, 70, 0.25);
        }


        /* =========================================
           BACK TO LOGIN
        ========================================= */

        .forgot-links {
            margin-top: 25px;

            text-align: center;
        }


        .forgot-links a {
            color: #73d8f7;

            text-decoration: none;

            font-size: 14px;
        }


        .forgot-links a:hover {
            color: #ffffff;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .forgot-password-page .nav-links {
                display: none;
            }

        }


        @media (max-width: 600px) {

            .forgot-wrapper {
                padding: 35px 16px;
            }

            .forgot-card {
                padding: 30px 22px;
            }

            .forgot-title {
                font-size: 30px;
            }

        }

    </style>

</head>


<body class="forgot-password-page">


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header>

        <nav class="navbar">

            <div class="container">

                <a href="../index.html" class="logo">
                    Polar<span>Connect</span>
                </a>


                <ul class="nav-links">

                    <li>
                        <a href="../index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="climate.html">
                            Climate
                        </a>
                    </li>

                    <li>
                        <a href="ice-glaciers.html">
                            Ice &amp; Glaciers
                        </a>
                    </li>

                    <li>
                        <a href="polar-oceans.html">
                            Polar Oceans
                        </a>
                    </li>

                    <li>
                        <a href="biodiversity.html">
                            Biodiversity
                        </a>
                    </li>

                    <li>
                        <a href="research.html">
                            Research
                        </a>
                    </li>

                    <li>
                        <a href="knowledge.html">
                            Knowledge
                        </a>
                    </li>

                    <li>
                        <a href="map.html">
                            Data &amp; Maps
                        </a>
                    </li>

                </ul>


                <div class="nav-actions">

                    <a
                        href="login.html"
                        class="nav-login"
                    >
                        Login
                    </a>

                </div>

            </div>

        </nav>

    </header>



    <!-- =========================================
         FORGOT PASSWORD
    ========================================== -->

    <main class="forgot-wrapper">

        <div class="forgot-card">


            <div class="forgot-tag">
                Account Recovery
            </div>


            <h1 class="forgot-title">
                Reset your password
            </h1>


            <p class="forgot-description">
                Enter your username and create a new password
                for your PolarConnect account.
            </p>


            <form id="forgot-password-form">


                <div class="forgot-group">

                    <label for="recovery-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="recovery-username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>



                <div class="forgot-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <div class="forgot-group">

                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Confirm your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <button
                    type="submit"
                    id="forgot-button"
                    class="forgot-button"
                >
                    Reset Password
                </button>


                <div
                    id="forgot-message"
                    class="forgot-message"
                ></div>


            </form>


            <div class="forgot-links">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>


        </div>

    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="../js/api.js"></script>
    <script src="../js/forgot-password.js"></script>

</body>

</html>
